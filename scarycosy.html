<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosy</title>
  <style>
    :root {
      --scary: hsl(210, 17%, 2%);
      --cosy: hsl(25, 62%, 81%);
    }

    body {
      width: 100vw;
      height: 200vh;
      background: var(--scary);
      margin: 0;
      overflow-x: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: scale-down;
      object-position: 50%;
    }

    .cosy {
      background: radial-gradient(circle at center, #e66465, #e6646530 20%, #9198e511 80%);
    }
  </style>
</head>

<body>
  <img src="dumpsterfire.png" alt="" srcset="">
  <img class="cosy" src="campfire.png" alt="" srcset="">
</body>

</html>
